name: build

on:
  push:
    branches: [ master, 'feature/**' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/global.json

      - uses: microsoft/setup-msbuild@v2

      - name: Build C#
        run: dotnet build ProcBridge.slnx -c Release

      # Relay integration tests run on a throw-away PostgreSQL cluster (trust auth, no password) when the runner image
      # ships PostgreSQL (PGBIN). If this step fails the Postgres tests report as skipped, the in-memory ones still run.
      - name: Start PostgreSQL for relay tests
        shell: pwsh
        continue-on-error: true
        run: |
          if (-not $env:PGBIN) { Write-Host "PGBIN not set: Postgres relay tests will be skipped."; exit 0 }
          $data = Join-Path $env:RUNNER_TEMP 'pgdata'
          & "$env:PGBIN\initdb.exe" -D $data -U postgres --auth=trust -E UTF8 | Out-Host
          if ($LASTEXITCODE -ne 0) { exit 0 }
          & "$env:PGBIN\pg_ctl.exe" -D $data -o "-p 55432 -c listen_addresses=localhost" -l (Join-Path $env:RUNNER_TEMP 'pg.log') -w start | Out-Host
          if ($LASTEXITCODE -ne 0) { exit 0 }
          "PROCBRIDGE_TEST_POSTGRES=Host=localhost;Port=55432;Username=postgres" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Test C#
        run: dotnet test ProcBridge.slnx -c Release --no-build --logger trx --results-directory TestResults

      - name: Build native x64
        run: msbuild ProcBridge.Native.sln -m -p:Configuration=Release -p:Platform=x64

      - name: Build native x86
        run: msbuild ProcBridge.Native.sln -m -p:Configuration=Release -p:Platform=x86

      - name: Upload native binaries
        uses: actions/upload-artifact@v4
        with:
          name: native-release
          path: |
            src/native/out/*/Release/*.dll
            src/native/out/*/Release/*.exe
